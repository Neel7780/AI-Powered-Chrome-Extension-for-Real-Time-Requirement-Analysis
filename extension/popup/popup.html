<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Requirement Analyzer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-brand">
        <div class="brand-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Requirement AI</h1>
          <span class="brand-sub">Real-Time Meeting Analysis</span>
        </div>
      </div>
      <div class="status-indicator">
        <span class="status-dot active"></span>
        <span class="status-text" id="status-text">Active</span>
      </div>
    </header>

    <!-- Quick Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-value" id="stat-utterances">0</span>
        <span class="stat-label">Utterances</span>
      </div>
      <div class="stat-card warning">
        <span class="stat-value" id="stat-ambiguous">0</span>
        <span class="stat-label">Ambiguities</span>
      </div>
      <div class="stat-card success">
        <span class="stat-value" id="stat-clarifications">0</span>
        <span class="stat-label">Clarifications</span>
      </div>
      <div class="stat-card highlight">
        <span class="stat-value" id="stat-quality">--</span>
        <span class="stat-label">Quality Score</span>
      </div>
    </div>

    <!-- Live Snippet View -->
    <div class="snippet-box">
      <div class="snippet-header">
        <span class="snippet-title">Live Transcript Stream</span>
        <span class="live-tag">LIVE</span>
      </div>
      <div class="snippet-content" id="latest-utterance">
        <span class="empty-hint">Waiting for Zoom/Meet live transcript...</span>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="actions-group">
      <button class="btn-primary" id="btn-open-sidepanel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        Open Analysis Side Panel
      </button>

      <button class="btn-secondary" id="btn-new-meeting" style="background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #6ee7b7;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        ▶ Start Transcribing
      </button>

      <button class="btn-secondary" id="btn-end-meeting" style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="6" y="6" width="12" height="12"></rect>
        </svg>
        ⏹ End &amp; Save to DB
      </button>


      <button class="btn-secondary" id="btn-load-sample">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Load Assignment PDF Meeting
      </button>

      <button class="btn-outline" id="btn-open-webapp">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        Launch Full Studio & Export
      </button>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span id="server-status">Backend: Connecting...</span>
      <button class="btn-text" id="btn-reset">Reset</button>
    </footer>
  </div>

  <script src="../shared/nlp-engine.js"></script>
  <script src="../shared/sample-data.js"></script>
  <script src="../shared/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
